name: probe
on:
  push:
    paths: ["tools/probe.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name "startpagina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe.txt
          git diff --cached --quiet || git commit -m "probe" && git push
