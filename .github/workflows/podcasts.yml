name: podcasts
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths: ["tools/podcasts.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  podcasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/podcasts.py
      - run: |
          git config user.name "startpagina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add podcasts.json
          git diff --cached --quiet && exit 0
          git commit -m "Podcasts bijgewerkt"
          git pull --rebase origin main
          git push
