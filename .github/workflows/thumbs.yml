name: thumbs
on:
  push:
    paths: ["data.json", "ida.json", "otto.json", "severine.json", "tools/thumbs.py"]
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: python3 tools/thumbs.py
      - run: |
          git config user.name "startpagina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add thumbs.json embed.json
          git diff --cached --quiet && exit 0
          git commit -m "Afbeeldingen bijgewerkt"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
