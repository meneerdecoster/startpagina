<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="apple-touch-icon" href="__ICON__">
<link rel="icon" type="image/png" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0E1424; --muted:#5B6478; --line:#E1E5EC;
  --accent:__ACCENT__;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius:22px; --shadow:0 1px 2px rgba(14,20,36,.04), 0 8px 28px -12px rgba(14,20,36,.12);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#090C14; --surface:#121725; --surface-2:#182033; --ink:#EEF1F8; --muted:#97A0B5; --line:#232B3E;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1240px; margin:0 auto; padding:0 20px 56px}
.hero{position:relative; overflow:hidden; color:#fff; padding:28px 0 92px; isolation:isolate}
.hero::before{content:""; position:absolute; inset:0; z-index:-2; background:var(--sky)}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; z-index:-1}
__SKIES__
.topbar{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; font-family:var(--mono); font-size:12.5px; letter-spacing:.02em; opacity:.92}
.clocks{display:flex; gap:18px; flex-wrap:wrap}
.clocks span b{font-weight:500; margin-left:6px}
.greet{font-family:var(--display); font-weight:800; font-size:clamp(44px,8.2vw,104px); line-height:.95; letter-spacing:-.035em; margin:56px 0 16px; text-wrap:balance; max-width:14ch}
.sub{font-size:clamp(16px,2vw,20px); opacity:.95; max-width:60ch; margin:0}
.wx{display:flex; gap:8px; margin-top:22px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wx .d{flex:1 0 auto; min-width:86px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:9px 12px; font-size:12.5px; line-height:1.35}
.wx .d.now{flex:2 0 auto; min-width:150px}
.wx .k{font:11px var(--mono); opacity:.85; text-transform:uppercase; letter-spacing:.05em}
.wx .i{font-size:20px; line-height:1.2}
.wx .tt{font-weight:600; font-size:15px}
.wx .r{opacity:.9}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:18px; margin-top:-60px; position:relative}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 22px 20px; min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:980px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
.card-h h2{font-family:var(--display); font-weight:600; font-size:21px; letter-spacing:-.015em; margin:0; display:flex; align-items:center; gap:10px}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.card-h .meta{font-family:var(--mono); font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.news{list-style:none; margin:0; padding:0; display:grid}
.news.cols{grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:28px}
@media (max-width:820px){.news.cols{grid-template-columns:1fr}}
.news li{padding:14px 0; border-top:1px solid var(--line)}
.news li:first-child,.news.cols li:nth-child(2){border-top:0; padding-top:2px}
@media (max-width:820px){.news.cols li:nth-child(2){border-top:1px solid var(--line); padding-top:14px}}
.news a.t{font-weight:600; font-size:15.5px; text-decoration:none; line-height:1.35}
.news a.t:hover{text-decoration:underline; text-underline-offset:3px}
.ph{display:none; aspect-ratio:16/9; border-radius:14px; overflow:hidden; margin:0 0 10px; background:linear-gradient(135deg,var(--line),transparent); position:relative}
.ph img{width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .4s}
.ph img.on{opacity:1}
.ph.has{display:block}
.news p{margin:6px 0 0; color:var(--muted); font-size:14px; max-width:68ch}
.src{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-top:6px; display:block}
.lead a.t{font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-.015em}
.lab{display:inline-block; font:600 11px var(--mono); letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); margin-bottom:6px}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
.tile{display:block; text-decoration:none}
.tile .tp{aspect-ratio:16/9; border-radius:14px; overflow:hidden; position:relative; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--surface-2)),var(--surface-2)); display:grid; place-items:center; font-size:34px}
.tile .tp img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.tile .pl{position:absolute; right:8px; bottom:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; display:grid; place-items:center; font-size:12px; padding-left:2px}
.tile .tt{font-weight:600; font-size:14px; line-height:1.3; margin-top:8px}
.tile:hover .tt{text-decoration:underline; text-underline-offset:3px}
.tile .ts{font:11px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:3px}
.land{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center}
.land .vl{font-size:72px; line-height:1}
.land h3{font-family:var(--display); font-size:26px; letter-spacing:-.02em; margin:0}
.land .hs{color:var(--muted); font-size:14px}
.land ul{grid-column:1/-1; margin:6px 0 0; padding-left:20px; display:grid; gap:8px}
.land li::marker{color:var(--accent)}
.quiz .q{font-family:var(--display); font-size:clamp(19px,2.2vw,24px); line-height:1.3; margin:0 0 12px; text-wrap:pretty}
.quiz ol{margin:0 0 14px; padding-left:22px; display:grid; gap:4px}
.quiz details{background:var(--surface-2); border-radius:14px; padding:12px 14px}
.quiz summary{cursor:pointer; font-weight:600; color:var(--accent); list-style:none}
.quiz summary::-webkit-details-marker{display:none}
.quiz details[open] summary{margin-bottom:8px}
.quiz .a{font-size:15px}
.feiten{display:grid; grid-template-columns:1fr; gap:12px}
.fe{display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:start; background:var(--surface-2); border-radius:16px; padding:12px 14px}
.fe .em{font-size:30px; line-height:1.1}
.fe b{display:block; font-weight:600; margin-bottom:2px}
.fe span{color:var(--muted); font-size:14px}
.fe a{font:11px var(--mono); color:var(--muted); text-transform:uppercase}
.mop{font-family:var(--display); font-size:clamp(19px,2.2vw,25px); line-height:1.35; margin:0}
.err{padding:30px; text-align:center; color:var(--muted)}
footer{margin-top:28px; font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:center}
</style>
</head>
<body>
<header class="hero" id="hero" data-part="ochtend">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="wrap" style="padding-bottom:0">
    <div class="topbar"><span id="datum">&nbsp;</span><span class="clocks" id="clocks"></span></div>
    <h1 class="greet" id="greet"></h1>
    <p class="sub" id="sub"></p>
    <div class="wx" id="wx" aria-label="Weer Merksem"></div>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</main>
<script>
(function(){
const CFG = /*CFG*/{};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tfetch=(url,ms=15000)=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t)); };
const now = new Date(), h = now.getHours();
const part = h>=5&&h<12 ? "ochtend" : h>=12&&h<18 ? "middag" : h>=18&&h<23 ? "avond" : "nacht";
$("hero").dataset.part = part;
const dagen=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"], dag=dagen[now.getDay()];
const seed = Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate())/864e5);
const pick = arr => arr[(seed*7+arr.length)%arr.length];
const fill = t => t.replaceAll("{dag}",dag).replaceAll("{naam}",CFG.naam);
$("greet").textContent = fill(pick(CFG.groet[part]));
$("sub").textContent = fill(pick(CFG.sub[part]));
const dt = now.toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("datum").textContent = dt.charAt(0).toUpperCase()+dt.slice(1);
function clocks(){
  const t=tz=>new Date().toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit",timeZone:tz});
  const here=Intl.DateTimeFormat().resolvedOptions().timeZone, items=[["Hier",here]];
  if (here!=="Europe/Brussels") items.push(["Merksem","Europe/Brussels"]);
  $("clocks").innerHTML = items.map(([n,tz])=>`<span>${esc(n)}<b>${t(tz)}</b></span>`).join("");
}
clocks(); setInterval(clocks,20000);

/* Zwevende icoontjes in de header */
(function sky(){
  const c=$("sky"), x=c.getContext("2d"); const ic=CFG.iconen&&CFG.iconen.length?CFG.iconen:["✦"]; let W,H,P=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ const r=devicePixelRatio||1; W=c.width=c.offsetWidth*r; H=c.height=c.offsetHeight*r;
    P=Array.from({length:CFG.iconen&&CFG.iconen.length?26:60},(_,i)=>({e:ic[i%ic.length], x:Math.random()*W, y:Math.random()*H, s:(CFG.iconen&&CFG.iconen.length?(18+Math.random()*30):(6+Math.random()*6))*r, p:Math.random()*6.28, v:.0035+Math.random()*.006, a:.28+Math.random()*.3, vy:(.12+Math.random()*.25)*r})); }
  function draw(){ x.clearRect(0,0,W,H); for(const p of P){ x.globalAlpha=p.a; x.font=p.s+"px serif"; x.textAlign="center"; x.fillText(p.e,p.x+Math.sin(p.p)*10,p.y); } x.globalAlpha=1; }
  size(); addEventListener("resize",size); draw();
  if (still) return;
  (function frame(){ for(const p of P){ p.p+=p.v; p.y-=p.vy; if(p.y<-60){ p.y=H+40; p.x=Math.random()*W; } } draw(); requestAnimationFrame(frame); })();
})();

/* Weer Merksem */
const WI=c=>c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌦️":c<=86?"🌨️":"⛈️";
const WT=c=>c===0?"Helder":c<=2?"Licht bewolkt":c===3?"Bewolkt":c<=48?"Mist":c<=57?"Motregen":c<=67?"Regen":c<=77?"Sneeuw":c<=82?"Buien":c<=86?"Sneeuwbuien":"Onweer";
function renderWx(w){
  const el=$("wx"); if(!w||!w.daily) return; const dg=v=>Math.round(v)+"°", dd=w.daily, c=w.current;
  let s=`<div class="d now"><div class="k">Merksem · nu</div><div class="tt"><span class="i">${WI(c.weather_code)}</span> ${dg(c.temperature_2m)}</div><div class="r">${WT(c.weather_code)} · ${dg(dd.temperature_2m_min[0])} / ${dg(dd.temperature_2m_max[0])} · ${dd.precipitation_probability_max[0]??0}% regen</div></div>`;
  for(let i=1;i<dd.time.length;i++){ const d=new Date(dd.time[i]+"T12:00").toLocaleDateString("nl-BE",{weekday:"short"});
    s+=`<div class="d"><div class="k">${d}</div><div class="tt"><span class="i">${WI(dd.weather_code[i])}</span> ${dg(dd.temperature_2m_max[i])}</div><div class="r">${dg(dd.temperature_2m_min[i])} · ${dd.precipitation_probability_max[i]??0}%</div></div>`; }
  el.innerHTML=s;
}
(async()=>{ try{ const c=localStorage.getItem("wx"); if(c) renderWx(JSON.parse(c)); }catch(e){}
  try{ const r=await tfetch("https://api.open-meteo.com/v1/forecast?latitude=51.248&longitude=4.45&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBrussels&forecast_days=4",10000);
    const w=await r.json(); renderWx(w); try{ localStorage.setItem("wx",JSON.stringify(w)); }catch(e){} }catch(e){} })();

/* Onderdelen */
const R = {
  news:(items,s)=> `<ul class="news${s.kolommen?" cols":""}">`+(items||[]).map((n,i)=>`<li class="${i===0&&!s.kolommen?"lead":""}">
    <a class="ph" href="${esc(n.url)}" target="_blank" rel="noopener" data-u="${esc(n.url)}" tabindex="-1" aria-hidden="true"></a>
    ${n.label?`<span class="lab">${esc(n.label)}</span><br>`:""}<a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titel)}</a>
    <p>${esc(n.samenvatting||"")}</p><span class="src">${esc(n.bron||"")}</span></li>`).join("")+`</ul>`,
  tiles:(items,s)=> `<div class="tiles">`+(items||[]).map(n=>`<a class="tile" href="${esc(n.url)}" target="_blank" rel="noopener">
    <div class="tp" data-t="${esc(n.url)}">${esc(n.emoji||s.emoji||"🎬")}${n.soort==="foto"?"":`<span class="pl">▶</span>`}</div>
    <div class="tt">${esc(n.titel)}</div><div class="ts">${esc(n.bron||"")}</div></a>`).join("")+`</div>`,
  land:(l)=> !l?"":`<div class="land"><div class="vl">${esc(l.vlag)}</div><div><h3>${esc(l.naam)}</h3><div class="hs">Hoofdstad: <b>${esc(l.hoofdstad)}</b></div></div>
    <ul>${(l.weetjes||[]).map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`,
  quiz:(q)=> !q?"":`<div class="quiz"><p class="q">${esc(q.vraag)}</p>${q.opties?`<ol type="A">${q.opties.map(o=>`<li>${esc(o)}</li>`).join("")}</ol>`:""}
    <details><summary>Toon de oplossing</summary><div class="a">${esc(q.oplossing)}${q.uitleg?`<br><span style="color:var(--muted)">${esc(q.uitleg)}</span>`:""}</div></details></div>`,
  feiten:(items)=> `<div class="feiten">`+(items||[]).map(f=>{ if(typeof f==="string") f={tekst:f};
    return `<div class="fe"><div class="em">${esc(f.emoji||"✨")}</div><div>${f.titel?`<b>${esc(f.titel)}</b>`:""}<span>${esc(f.tekst)}</span>${f.url?` <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.bron||"bron")} ↗</a>`:""}</div></div>`; }).join("")+`</div>`,
  mop:(m)=> !m?"":(m.vraag?`<p class="mop">${esc(m.vraag)}</p><div class="quiz" style="margin-top:12px"><details><summary>Toon het antwoord</summary><div class="a">${esc(m.antwoord)}</div></details></div>`:`<p class="mop">${esc(m.tekst)}</p>`)
};
function build(d){
  $("grid").innerHTML = CFG.secties.map(s=>{
    const body = R[s.type](d[s.key], s); if (!body) return "";
    return `<section class="card span-${s.span||12}"><div class="card-h"><h2><span class="dot" style="background:${s.kleur||"var(--accent)"}"></span>${esc(s.titel)}</h2><span class="meta">${esc(s.meta||"")}</span></div>${body}</section>`;
  }).join("");
  const dtm = d.bijgewerkt ? new Date(d.bijgewerkt).toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"}) : "";
  $("foot").textContent = (dtm?`Bijgewerkt op ${dtm} · `:"")+"v1";
  loadImgs();
}
/* Foto's: opgezocht door een GitHub-taak (thumbs.json) */
let TH=null;
async function th(){ if(TH===null){ try{ TH=await (await tfetch("thumbs.json?"+Date.now(),8000)).json(); }catch(e){ TH={}; } } return TH; }
async function loadImgs(){
  const T=await th();
  document.querySelectorAll(".ph[data-u]").forEach(el=>{
    const src=T[el.dataset.u]; if(!src) return;
    const im=new Image(); im.alt=""; im.decoding="async"; im.referrerPolicy="no-referrer";
    im.onload=()=>{ const ar=im.naturalWidth/im.naturalHeight; if(im.naturalWidth<400||ar<1.25||ar>2.5){ im.remove(); return; } el.classList.add("has"); im.classList.add("on"); };
    im.onerror=()=>{ if(!im.dataset.raw){ im.dataset.raw=1; im.src=src; } else im.remove(); };
    im.src="https://wsrv.nl/?w=800&h=450&fit=cover&a=attention&output=webp&q=72&url="+encodeURIComponent(src);
    el.prepend(im);
  });
  document.querySelectorAll(".tp[data-t]").forEach(el=>{
    const src=T[el.dataset.t]; if(!src) return;
    const im=new Image(); im.alt=""; im.referrerPolicy="no-referrer";
    im.onload=()=>{ if(im.naturalWidth<250){ return; } el.firstChild.nodeType===3&&(el.firstChild.textContent=""); el.prepend(im); };
    im.src="https://wsrv.nl/?w=480&h=270&fit=cover&output=webp&q=72&url="+encodeURIComponent(src);
  });
}
fetch(CFG.json+"?"+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(build).catch(()=>{ $("grid").innerHTML=`<section class="card span-12"><div class="err">De pagina wordt straks voor het eerst gevuld. Probeer het later nog eens.</div></section>`; });
})();
</script>
</body>
</html>
